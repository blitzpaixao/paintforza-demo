<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Oficina — Paint Forza</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/img/icone.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css?v=4">
  <link rel="stylesheet" href="assets/css/app.css?v=7">
  <link rel="stylesheet" href="assets/css/docs.css?v=7">
</head>
<body class="app">
  <div class="entrar" id="entrar" hidden>
    <div class="entrar__box">
      <img src="assets/img/logo-branco.png" alt="Paint Forza" class="entrar__logo">
      <h1>Sistema da oficina</h1>
      <p>Ordens de serviço, vistoria, pátio e financeiro de cada carro, em um só lugar.</p>
      <button class="btn btn--tape" id="btnEntrar" type="button">Entrar na demonstração</button>
      <p class="entrar__nota">Versão de demonstração. Os dados ficam salvos apenas neste navegador.</p>
      <a href="index.html">Voltar ao site</a>
    </div>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="lateral">
      <a class="logo lateral__logo" href="#/painel"><img src="assets/img/logo-branco.png" alt="Paint Forza"></a>
      <nav class="menu" aria-label="Seções do sistema">
        <a href="#/painel" data-nav="painel"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg><span>Painel</span></a>
        <a href="#/patio" data-nav="patio"><svg viewBox="0 0 24 24"><path d="M3 4h5v16H3zM9.5 4h5v11h-5zM16 4h5v7h-5z"/></svg><span>Pátio</span></a>
        <a href="#/agenda" data-nav="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke-width="2"/></svg><span>Agenda</span></a>
        <a href="#/os" data-nav="os"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM14 3v5h5M9 12h8M9 16h8M9 8h3" fill="none" stroke-width="2"/></svg><span>Ordens de serviço</span></a>
        <a href="#/veiculos" data-nav="veiculos"><svg viewBox="0 0 24 24"><path d="M5 11l2-5h10l2 5M3 11h18v6H3zM6 17v2M18 17v2" fill="none" stroke-width="2"/><circle cx="7" cy="14" r="1.3"/><circle cx="17" cy="14" r="1.3"/></svg><span>Veículos</span></a>
        <a href="#/clientes" data-nav="clientes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4" fill="none" stroke-width="2"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 010 8M22 21c0-3-2-5-4-5.6" fill="none" stroke-width="2"/></svg><span>Clientes</span></a>
        <a href="#/estoque" data-nav="estoque"><svg viewBox="0 0 24 24"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z M3 7.5l9 4.5 9-4.5M12 12v9" fill="none" stroke-width="2" stroke-linejoin="round"/></svg><span>Estoque</span></a>
        <a href="#/financeiro" data-nav="financeiro"><svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z" fill="none" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke-width="2"/><path d="M6 9v.01M18 15v.01" stroke-width="3"/></svg><span>Financeiro</span></a>
        <a href="#/config" data-nav="config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" fill="none" stroke-width="2"/></svg><span>Ajustes</span></a>
        <a href="#/mais" data-nav="mais" class="so-celular"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span>Mais</span></a>
      </nav>
      <div class="lateral__rodape">
        <a href="index.html" target="_blank">Ver site</a>
        <button type="button" id="btnSair">Sair</button>
      </div>
    </aside>

    <div class="principal">
      <header class="barra">
        <form class="busca" id="busca" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2"/></svg>
          <input class="input" name="q" placeholder="Buscar placa, cliente ou nº da OS" autocomplete="off" aria-label="Buscar placa, cliente ou número da OS">
        </form>
        <button class="btn btn--tape" type="button" data-action="nova-os">Nova OS</button>
      </header>
      <main class="conteudo" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__fundo" data-action="fechar-modal"></div>
    <div class="modal__caixa" role="dialog" aria-modal="true" aria-labelledby="modalTitulo"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="assets/js/core.js?v=7"></script>
  <script src="assets/js/docs.js?v=8"></script>
  <script src="assets/js/app.js?v=7"></script>
</body>
</html>
